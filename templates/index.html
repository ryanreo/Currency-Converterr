<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Currency Converter</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 50px;
        }
        .container {
            width: 300px;
            margin: auto;
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 8px;
            box-shadow: 2px 2px 10px rgba(0, 0, 0, 0.1);
        }
        select, input, button {
            width: 100%;
            margin: 10px 0;
            padding: 8px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Currency Converter</h2>
        <input type="number" id="amount" placeholder="Enter amount" />
        <select id="from_currency">
            <option value="USD">USD</option>
            <option value="EUR">EUR</option>
            <option value="KES">KES</option>
            <option value="GBP">GBP</option>
            <option value="INR">INR</option>
        </select>
        <select id="to_currency">
            <option value="USD">USD</option>
            <option value="EUR">EUR</option>
            <option value="KES">KES</option>
            <option value="GBP">GBP</option>
            <option value="INR">INR</option>
        </select>
        <button onclick="convert()">Convert</button>
        <h3 id="result"></h3>
    </div>

    <script>
        function convert() {
            let amount = document.getElementById("amount").value;
            let from_currency = document.getElementById("from_currency").value;
            let to_currency = document.getElementById("to_currency").value;

            fetch("/convert", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ amount: amount, from: from_currency, to: to_currency })
            })
            .then(response => response.json())
            .then(data => {
                if (data.converted_amount) {
                    document.getElementById("result").innerText = `Converted Amount: ${data.converted_amount} ${to_currency}`;
                } else {
                    document.getElementById("result").innerText = "Conversion failed!";
                }
            });
        }
    </script>

</body>
</html>
